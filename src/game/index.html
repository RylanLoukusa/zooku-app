<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zooku · Daily Animal Puzzle</title>
<meta name="description" content="A new animal puzzle every day. Place five prey and one predator on a 3×3 board, then decide: feed the predator or protect the prey. Find the perfect layout.">
<link rel="canonical" href="https://zooku.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zooku">
<meta property="og:url" content="https://zooku.app/">
<meta property="og:title" content="Zooku · Daily Animal Puzzle">
<meta property="og:description" content="Feed the predator or protect the prey? A new animal puzzle every day.">
<meta property="og:image" content="https://zooku.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Zooku: a 3×3 board of painted specimen cards beside a watering hole">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zooku.app/og-image.png">
<meta name="theme-color" content="#f4ead2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/fonts/cormorant-garamond-latin-600-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{styles.css}}">
</head>
<body>
<div class="vignette" aria-hidden="true"></div>
<div class="scene" aria-hidden="true"><svg id="sceneSvg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice"></svg></div>

<div class="app" id="app">
  <header class="top">
    <button class="icon-btn" id="helpBtn" aria-label="How to play">?</button>
    <h1 class="logo">Zooku</h1>
    <button class="icon-btn" id="calBtn" aria-label="Past puzzles">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2f3a2c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="1.5"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
    </button>
  </header>
  <div class="dayline" id="dayline"></div>

  <section class="scorebar" aria-label="Score">
    <div class="stat"><span class="lbl">Score</span><span class="num" id="scoreNum">0</span></div>
    <div class="stat"><span class="lbl">Best</span><span class="num" id="bestNum">–</span><button class="restore" id="restoreBtn" disabled>Return to best</button></div>
    <div class="stat"><span class="lbl">Perfect</span><span class="num perfect" id="perfectNum">?</span></div>
  </section>

  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="actions">
    <button class="guide-btn" id="guideBtn" aria-label="Meet today’s animals">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2f3a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z" fill="rgba(201,150,82,0.25)"></path><path d="M12 6.5v13M6 8.5c1.5-.2 3 0 4 .6M6 11.5c1.5-.2 3 0 4 .6M14 9.1c1-.6 2.5-.8 4-.6M14 12.1c1-.6 2.5-.8 4-.6"></path></svg>
      <small>Animals</small>
    </button>
    <button class="survey" id="surveyBtn" disabled><b>Survey</b><small id="surveySub">6 specimens left</small></button>
    <span aria-hidden="true"></span>
  </div>

  <section class="hand" id="hand" aria-label="Specimens to place"></section>
  <div class="hand-tools" id="handTools"></div>
  <p class="hint">Hover a specimen to read its notes (tap on a phone) · drag it into place</p>
  <button class="foot-link" id="roadBtn">What’s coming · Suggest &amp; vote</button>
  <p class="foot-note">A new puzzle every day at midnight Eastern · <button class="foot-mini" id="privBtn">Privacy</button></p>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<!-- Released days (written by scripts/build.js), then the shared engine and art, then the game. -->
<script src="{{days.js}}"></script>
<script src="{{engine.js}}"></script>
<script src="{{art.js}}"></script>
<script src="{{app.js}}"></script>
</body>
</html>
