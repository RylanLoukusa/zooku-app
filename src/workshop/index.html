<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zooku Workshop</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Layout: the designer's desk for upcoming Zooku days. A summary strip and toolbar, a filter, then one journal
   card per day (perfect-layout board on the left, stats and the hand on the right, Approve/Regenerate below).
   Same paper-and-ink look as the game; a single light look by choice, set explicitly. */
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 500; src: url('/fonts/cormorant-garamond-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 600; src: url('/fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 600; src: url('/fonts/cormorant-garamond-latin-600-italic.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; src: url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; src: url('/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; src: url('/fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
:root {
  color-scheme: light;
  --paper: #f4ead2; --card: #fbf6ea; --ink: #2f3a2c; --ink-soft: #5b4a36; --label: #6a4f33; --rust: #b5593a;
  --sage: 138, 163, 123; --rust-w: 196, 104, 70; --ochre: 201, 150, 82; --hab: 222, 182, 120;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-weight: 500; font-size: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 48px; }

header.top h1 { margin: 0; font-style: italic; font-weight: 600; font-size: 40px; line-height: 1; }
header.top h1 small { font-style: normal; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); margin-left: 10px; vertical-align: middle; }
header.top p { margin: 8px 0 0; font-size: 17px; color: var(--ink-soft); max-width: 70ch; }
.status { margin-top: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--label); }
.status.warn { color: var(--rust); }

.summary { margin: 18px 0 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid rgba(47, 58, 44, .5); background: var(--card); border-radius: 3px; padding: 5px 9px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-soft); }
.chip b { color: var(--ink); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 16px; }
.filters button { border: 1.2px solid var(--ink); background: var(--card); padding: 6px 12px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
.filters button + button { border-left: 0; }
.filters button[aria-pressed="true"] { background: rgba(var(--sage), .55); }

.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .days { grid-template-columns: 1fr; } }
.day { background: var(--card); border: 1.2px solid var(--ink); border-radius: 4px; box-shadow: 2px 3px 0 rgba(47, 58, 44, .14); padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.day.ok { border-left: 5px solid rgba(var(--sage), 1); }
.day.live { background: #f6efdd; }
.day .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.day .when { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--label); white-space: nowrap; }
.day h2 { margin: 0; font-style: italic; font-weight: 600; font-size: 24px; line-height: 1.05; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border: 1px solid rgba(47, 58, 44, .45); border-radius: 2px; color: var(--ink-soft); background: #fffaf0; }
.tag.d-Easy { background: rgba(var(--sage), .3); } .tag.d-Medium { background: rgba(var(--hab), .45); } .tag.d-Hard { background: rgba(var(--rust-w), .3); }
.tag.live { border-color: var(--rust); color: var(--rust); }
.tag.ok { background: rgba(var(--sage), .55); color: var(--ink); }
.tag.new { border-style: dashed; }
.day .body { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 520px) { .day .body { grid-template-columns: 1fr; } .mini { max-width: 220px; } }

/* mini board: the perfect layout */
.mini { display: grid; gap: 4px; width: 100%; }
.mini .c { aspect-ratio: 1; border: 1px solid rgba(47, 58, 44, .4); border-radius: 4px; background: radial-gradient(ellipse at 50% 55%, rgba(var(--ochre), .3), rgba(var(--ochre), .08)); position: relative; display: grid; place-items: center; min-width: 0; }
.mini .c svg { width: 74%; height: 74%; }
.mini .c.k-prey { background: linear-gradient(180deg, rgba(var(--sage), .5), rgba(var(--sage), .2)), var(--card); border-color: var(--ink); }
.mini .c.k-pred { background: linear-gradient(180deg, rgba(var(--rust-w), .5), rgba(var(--rust-w), .2)), var(--card); border-color: var(--ink); }
.mini .c.eaten svg { filter: grayscale(1); opacity: .35; }
.mini .c.eaten::after { content: 'eaten'; position: absolute; font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--rust); border: 1px solid var(--rust); background: rgba(251, 246, 234, .9); padding: 0 3px; transform: rotate(-12deg); }
.mini .pts { position: absolute; top: -6px; left: -6px; min-width: 18px; height: 18px; padding: 0 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 11px; line-height: 1; z-index: 1; }
.mini .bp { border: 1.2px solid var(--ink); border-radius: 12px; display: grid; place-items: center; min-width: 0; min-height: 0; }
.mini .bp.water { background: radial-gradient(ellipse at 50% 35%, rgba(150, 196, 206, .55), rgba(84, 146, 166, .85)); }
.mini .bp.hedge { background: radial-gradient(ellipse at 50% 40%, rgba(126, 168, 98, .5), rgba(95, 138, 82, .8)); }
.mini .bp.grass { background: radial-gradient(ellipse at 50% 40%, rgba(214, 205, 120, .55), rgba(170, 160, 82, .85)); }
.mini .bp svg { width: 70%; height: 70%; max-width: 40px; max-height: 40px; }

.info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid rgba(47, 58, 44, .35); border-radius: 3px; background: linear-gradient(180deg, rgba(var(--hab), .3), rgba(var(--hab), .12)); }
.stats div { padding: 4px 6px; display: flex; flex-direction: column; min-width: 0; }
.stats div + div { border-left: 1px solid rgba(47, 58, 44, .25); }
.stats span { font-family: var(--mono); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--label); }
.stats b { font-weight: 600; font-size: 22px; line-height: 1.05; font-variant-numeric: tabular-nums lining-nums; }
.stats .win b { color: var(--rust); }
.meta { font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--ink-soft); }
.hand { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 15px; line-height: 1.25; }
.hand li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 7px; align-items: baseline; }
.sw { width: 9px; height: 9px; border: 1px solid var(--ink); display: inline-block; }
.sw.k-prey { background: rgba(var(--sage), .75); } .sw.k-pred { background: rgba(var(--rust-w), .75); } .sw.k-habitat { background: rgba(var(--hab), .85); }
.hand b { font-style: italic; font-weight: 600; }
.hand .x { color: var(--ink-soft); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid rgba(47, 58, 44, .2); padding-top: 10px; }
.btn { border: 1.2px solid var(--ink); border-radius: 3px; background: var(--card); padding: 5px 12px; font-style: italic; font-weight: 600; font-size: 17px; box-shadow: 1px 2px 0 rgba(47, 58, 44, .15); }
.btn.go { background: linear-gradient(180deg, rgba(var(--sage), .65), rgba(118, 145, 104, .7)), var(--paper); }
.btn[aria-pressed="true"] { background: rgba(var(--sage), .75); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.link { border: 0; background: none; padding: 2px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; }
.actions .note { font-family: var(--mono); font-size: 9.5px; color: var(--label); margin-left: auto; }
.busy { font-family: var(--mono); font-size: 10.5px; color: var(--label); }
.empty { font-style: italic; color: var(--ink-soft); padding: 30px 0; text-align: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
.toolbar .hint { font-family: var(--mono); font-size: 10.5px; color: var(--label); }
.toolbar code { font-family: var(--mono); font-size: 10.5px; background: #fffaf0; border: 1px solid rgba(47, 58, 44, .3); padding: 1px 5px; border-radius: 2px; }
.chip.warn { border-color: var(--rust); color: var(--rust); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Zooku Workshop <small>Local · never deployed</small></h1>
    <p>Every day in the calendar, with its perfect layout. Approve the days you like and regenerate the ones you don’t. Days that are already live are locked. Changes save straight to <code>data/calendar.json</code>; commit and push them to publish.</p>
    <div class="status" id="status">Loading…</div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <button class="btn" id="genBtn">＋ Generate 30 more days</button>
    <span class="hint" id="genNote"></span>
  </div>
  <div class="filters" role="group" aria-label="Show">
    <button data-f="upcoming" aria-pressed="true">Upcoming</button><button data-f="review" aria-pressed="false">To review</button><button data-f="ok" aria-pressed="false">Approved</button><button data-f="new" aria-pressed="false">Regenerated</button><button data-f="all" aria-pressed="false">All days</button>
  </div>
  <main class="days" id="days"></main>
</div>
<script src="/shared/engine.js"></script>
<script src="/shared/art.js"></script>
<script src="/workshop/workshop.js"></script>
</body>
</html>
